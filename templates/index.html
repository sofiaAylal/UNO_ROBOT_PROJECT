<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNO Robot Master - Industrial Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white font-sans min-h-screen">

    <nav class="bg-slate-800/80 backdrop-blur-md p-4 flex justify-center gap-12 border-b border-slate-700 sticky top-0 z-50">
        <button onclick="switchTab('tab-game')" class="font-black uppercase tracking-[0.2em] text-blue-400 border-b-2 border-blue-400 pb-1">Game Control</button>
        <button onclick="switchTab('tab-stats')" class="font-black uppercase tracking-[0.2em] text-slate-400 hover:text-white transition-all">Analytics Dashboard</button>
    </nav>

    <div id="tab-game" class="tab-content p-8 max-w-7xl mx-auto relative">
        <div id="start-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/95 backdrop-blur-md transition-all">
            <div class="bg-blue-600 p-16 rounded-[3.5rem] border-b-[12px] border-blue-800 text-center shadow-2xl scale-110">
                <h1 class="text-7xl font-black mb-10 tracking-tighter uppercase italic drop-shadow-2xl">Uno Robot</h1>
                <button onclick="startGame()" class="bg-white text-blue-600 px-20 py-8 rounded-full font-black text-4xl shadow-2xl hover:bg-slate-100 transition-all uppercase">Start Engine 🚀</button>
            </div>
        </div>

        <div class="max-w-3xl mx-auto mb-12 flex flex-col gap-6">
            <button onclick="handleAction()" id="main-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 py-10 rounded-[2.5rem] font-black text-4xl shadow-xl border-b-8 border-emerald-900 uppercase transition-all">
                📸 <span id="btn-text">System Initialization</span>
            </button>

            <button onclick="resetGame()" id="reset-btn" class="hidden w-full bg-blue-600 hover:bg-blue-500 py-8 rounded-[2rem] font-black text-3xl shadow-xl border-b-8 border-blue-900 uppercase transition-all animate-pulse">
                🔄 New Round
            </button>

            <div id="extra-controls" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="humanDraw()" class="bg-slate-600 hover:bg-slate-500 py-5 rounded-[1.5rem] font-black text-lg shadow-lg border-b-4 border-slate-900 uppercase tracking-tight">🃏 I Draw / Pass</button>
                <button onclick="addCard()" class="bg-orange-600 hover:bg-orange-500 py-5 rounded-[1.5rem] font-black text-lg shadow-lg border-b-4 border-orange-900 uppercase tracking-tight">➕ Robot Draw</button>
                <button onclick="declareHumanWin()" class="bg-yellow-500 hover:bg-yellow-400 py-5 rounded-[1.5rem] font-black text-lg shadow-lg border-b-4 border-yellow-800 text-slate-900 uppercase tracking-tight">🏆 I Win!</button>
            </div>
        </div>

        

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="bg-slate-800 p-10 rounded-[3rem] border-b-8 border-blue-600 shadow-2xl">
                <h2 class="text-5xl font-black mb-8 italic text-blue-500 uppercase text-center tracking-tighter">Robot</h2>
                <div class="mb-8 bg-slate-900/80 py-8 rounded-[2.5rem] border border-slate-700 text-center shadow-inner">
                    <p class="text-[11px] text-slate-500 uppercase font-black mb-2 tracking-[0.2em]">Current Table State</p>
                    <div id="discard-card" class="text-5xl font-black text-orange-500 italic uppercase">---</div>
                </div>
                <div class="bg-black/80 rounded-[2.5rem] border-2 border-blue-500/30 h-64 flex items-center justify-center px-10 text-center shadow-inner relative overflow-hidden">
                    <p id="decision-text" class="text-4xl font-black uppercase text-blue-300 italic tracking-tighter leading-none z-10">---</p>
                </div>
            </div>

            <div class="bg-slate-800 p-10 rounded-[3rem] border-b-8 border-orange-600 shadow-2xl text-center">
                <h2 class="text-5xl font-black mb-8 italic text-orange-500 uppercase text-center tracking-tighter">Vision Nova</h2>
                <div class="bg-slate-900/80 p-12 rounded-[2.5rem] mb-10 border border-slate-700 shadow-inner">
                    <span class="text-[11px] font-black text-slate-500 uppercase tracking-widest">Robot Hand Size</span>
                    <div id="scan-val" class="text-[10rem] leading-none font-black text-orange-500 mt-4 drop-shadow-2xl">0</div>
                </div>
                <div class="p-6 bg-black/60 rounded-[1.5rem] border border-slate-700/50 flex justify-between items-center font-mono">
                    <span class="text-[10px] text-slate-500 uppercase tracking-widest text-slate-500">SICK NOVA LINK:</span>
                    <span id="raw-data" class="text-emerald-400 font-bold text-2xl uppercase tracking-widest tracking-widest">---</span>
                </div>
            </div>
        </div>

        <div class="mt-12 bg-slate-800/30 p-8 rounded-[2.5rem] border border-slate-700 backdrop-blur-sm">
            <h3 class="text-center text-[10px] font-black uppercase text-slate-500 mb-6 tracking-[0.5em]">Memory Buffer hand_list[]</h3>
            <div id="hand-list" class="flex flex-wrap justify-center gap-4"></div>
        </div>
    </div>

    <div id="tab-stats" class="tab-content hidden p-12 max-w-7xl mx-auto">
        <h2 class="text-6xl font-black mb-16 italic text-blue-500 uppercase tracking-tighter text-center">Analytical Dashboard</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <div class="bg-slate-800 p-12 rounded-[3rem] border-b-8 border-blue-600 shadow-2xl text-center">
                <p class="text-slate-500 font-black uppercase tracking-widest mb-4 text-xs">Total Match Sessions</p>
                <div id="stat-total" class="text-8xl font-black text-white">0</div>
            </div>
            <div class="bg-slate-800 p-12 rounded-[3rem] border-b-8 border-emerald-600 shadow-2xl text-center">
                <p class="text-slate-500 font-black uppercase tracking-widest mb-4 text-xs">Robot Win Rate</p>
                <div id="stat-winrate" class="text-8xl font-black text-emerald-500">0%</div>
            </div>
            <div class="bg-slate-800 p-12 rounded-[3rem] border-b-8 border-orange-600 shadow-2xl text-center">
                <p class="text-slate-500 font-black uppercase tracking-widest mb-4 text-xs">Avg Match Time</p>
                <div id="stat-duration" class="text-8xl font-black text-orange-500">0s</div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
